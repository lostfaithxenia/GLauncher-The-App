<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>GLauncher Trophy Popup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      color: #f8fafc;
      overflow: hidden;
      pointer-events: none;
    }
    .trophy-toast {
      margin: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(12, 16, 28, 0.94), rgba(7, 10, 18, 0.96));
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.72), 0 0 22px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 13px;
      transform: translateX(115%);
      opacity: 0;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    .trophy-toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    body.theme-xmb .trophy-toast {
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(28, 36, 54, 0.94) 0%, rgba(14, 19, 30, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.32);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.8);
    }
    .icon-box {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grade-dot {
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0f172a;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      display: grid;
      place-items: center;
      font-size: 10px;
    }
    .meta {
      min-width: 0;
      flex: 1;
    }
    .eyebrow {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .title {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="trophyToast" class="trophy-toast">
    <div class="icon-box">
      <img id="trophyImg" src="./assets/maxmb/icons/trophies/trophy_gold.svg" alt="" />
      <span id="trophyGrade" class="grade-dot">🏆</span>
    </div>
    <div class="meta">
      <div id="trophyEyebrow" class="eyebrow">Trophy Unlocked</div>
      <div id="trophyTitle" class="title">Achievement</div>
      <div id="trophySub" class="sub">Game Title</div>
    </div>
  </div>
  <script>
    const toast = document.getElementById('trophyToast');
    const imgEl = document.getElementById('trophyImg');
    const gradeEl = document.getElementById('trophyGrade');
    const eyebrowEl = document.getElementById('trophyEyebrow');
    const titleEl = document.getElementById('trophyTitle');
    const subEl = document.getElementById('trophySub');
    let hideTimer = null;

    const GRADE_ICONS = {
      platinum: { src: './assets/maxmb/icons/trophies/trophy_platinum.svg', badge: '💎', label: 'Platinum Trophy Unlocked' },
      gold: { src: './assets/maxmb/icons/trophies/trophy_gold.svg', badge: '🥇', label: 'Gold Trophy Unlocked' },
      silver: { src: './assets/maxmb/icons/trophies/trophy_silver.svg', badge: '🥈', label: 'Silver Trophy Unlocked' },
      bronze: { src: './assets/maxmb/icons/trophies/trophy_bronze.svg', badge: '🥉', label: 'Bronze Trophy Unlocked' }
    };

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [880, 1318.5, 1760].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.09);
          gain.gain.setValueAtTime(0.001, now + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.14, now + i * 0.09 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.09);
          osc.stop(now + i * 0.09 + 0.48);
        });
      } catch {}
    }

    window.launcherAPI?.onTrophyPopup?.((data) => {
      document.body.classList.toggle('theme-xmb', data?.theme === 'xmb');
      const g = GRADE_ICONS[data?.grade] || GRADE_ICONS.bronze;
      imgEl.src = data?.icon || g.src;
      gradeEl.textContent = g.badge;
      eyebrowEl.textContent = g.label;
      titleEl.textContent = data?.title || 'Achievement Unlocked';
      subEl.textContent = data?.desc || data?.gameTitle || '';
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      playChime();
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => toast.classList.remove('show'), 4600);
    });
  </script>
</body>
</html>
